<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusBot • Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="grid"></div>
  <div id="siteHeader"></div>

  <div class="auth-page">
    <div class="auth-card auth-login">
      <h1>Sign in with email</h1>
      <p class="subtitle">Sign into CampusBot to access resources.</p>

      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm-.4 4.25-6.54 4.9a1.8 1.8 0 0 1-2.12 0L4.4 8.25V6.8l7.14 5.35a.75.75 0 0 0 .9 0L19.6 6.8Z"/></svg>
        <input id="loginEmail" type="email" placeholder="Email" />
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 8h-1V6a4 4 0 1 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-6 8.73V17a1 1 0 1 0 2 0v-.27a2 2 0 1 0-2 0ZM10 8V6a2 2 0 1 1 4 0v2Z"/></svg>
        <input type="password" placeholder="Password" />
      </div>

      <a href="#" class="forgot">Forgot password?</a>
      <button class="submit" id="loginBtn">Get Started</button>

      <div class="divider">Or sign in with</div>

      <div class="socials">
        <button class="social google" type="button">G</button>
        <button class="social facebook" type="button">f</button>
        <button class="social apple" type="button"></button>
      </div>

      <div class="bottom-text">
        Don't have an account? <a class="signup-link" href="signup.html">Sign up</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Reena Jennifer P • 24BCE1041 • CampusBot</p>
  </footer>

  <script src="js/site-header.js"></script>
  <script> renderSiteHeader(""); </script>
  <script src="js/bg-canvas.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
