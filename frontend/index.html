<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusBot Landing Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --bg: #000000;
      --text: #f6f7ff;
      --muted: #9ca3b7;
      --line: rgba(255,255,255,0.10);
      --panel: rgba(18, 20, 32, 0.72);
      --panel-2: rgba(255,255,255,0.04);
      --accent: #b9a8ff;
      --accent-2: #4d8dff;
      --shadow: 0 24px 60px rgba(0,0,0,0.55);
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      overflow-x: hidden;
      background: var(--bg);
    }

    body {
      background:
        radial-gradient(circle at 18% 18%, rgba(77,141,255,0.20), transparent 20%),
        radial-gradient(circle at 80% 20%, rgba(143,107,255,0.18), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(122,166,255,0.12), transparent 28%),
        #000;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      position: relative;
      padding-bottom: 48px;
    }

    .container {
      width: min(1220px, calc(100vw - 64px));
      margin: 0 auto;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 24px 0 18px;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #fff;
      justify-self: start;
    }

    .brand-badge {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      color: #0b0d14;
      font-size: 16px;
    }

    .brand-text span {
      color: var(--accent);
    }

    .nav-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      margin-left: 0;
      justify-self: center;
    }

    .nav-pill a {
      text-decoration: none;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      padding: 9px 20px;
      border-radius: 10px;
      transition: 0.2s ease;
    }

    .nav-pill a.active {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #07080d;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(77,141,255,0.20);
    }

    .auth {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 16px;
      font-weight: 500;
      justify-self: end;
    }

    .auth a {
      text-decoration: none;
      color: var(--muted);
    }

    .auth .signup {
      color: #07080d;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      padding: 10px 17px;
      border-radius: 10px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(77,141,255,0.20);
    }

    .hero {
      text-align: center;
      padding-top: 90px;
      padding-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .hero h1 {
      font-size: clamp(42px, 5vw, 76px);
      line-height: 1.02;
      letter-spacing: -0.045em;
      font-weight: 700;
      max-width: 820px;
      margin: 0 auto;
      text-wrap: balance;
      color: #fff;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero p {
      margin: 22px auto 0;
      max-width: 780px;
      font-size: 17px;
      line-height: 1.6;
      color: var(--muted);
      font-weight: 400;
    }

    .cta-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 34px;
    }

    .btn {
      height: 56px;
      min-width: 190px;
      padding: 0 28px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      transition: 0.18s ease;
      border: 1px solid var(--line);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #07080d;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(77,141,255,0.20);
      border: none;
    }

    .btn.secondary {
      color: var(--text);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    @media (max-width: 980px) {
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
      }

      .nav-pill {
        order: 3;
        width: 100%;
        margin-left: 0;
        justify-content: center;
        flex-wrap: wrap;
      }

      .hero {
        padding-top: 42px;
      }
    }

    @media (max-width: 640px) {
      .container {
        width: calc(100vw - 24px);
      }

      header {
        padding-top: 18px;
      }

      .brand {
        font-size: 18px;
      }

      .brand-badge {
        width: 34px;
        height: 34px;
        font-size: 14px;
      }

      .auth {
        gap: 12px;
        font-size: 15px;
      }

      .nav-pill a {
        padding: 8px 14px;
        font-size: 14px;
      }

      .hero h1 {
        font-size: 42px;
      }

      .hero p {
        font-size: 15px;
        max-width: 95%;
      }

      .cta-row {
        flex-direction: column;
        align-items: center;
      }

      .btn {
        width: min(100%, 280px);
        min-width: 0;
        height: 54px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="container">
      <header>
        <div class="brand">
          <div class="brand-badge">
            <i class="fa-solid fa-building-columns"></i>
          </div>
          <div class="brand-text">Campus<span>Bot</span></div>
        </div>

        <nav class="nav-pill">
          <a href="#" class="active">Home</a>
          <a href="about.html">About</a>
          <a href="chat.html">Chat</a>
          <a href="dashboard.html">Dashboard</a>
        </nav>

        <div class="auth">
          <a href="login.html">Log in</a>
          <a href="signup.html" class="signup">Sign Up</a>
        </div>
      </header>

      <section class="hero">
        <h1>Faster Answers. Smarter Experience.</h1>
        <p>
          CampusBot helps students quickly explore campus information, academic details,
          announcements, departments, contacts, and updates through a clean and modern chatbot experience.
        </p>

        <div class="cta-row">
          <a class="btn primary" href="chat.html">Ask CampusBot</a>
        </div>
      </section>
    </div>
  </div>

  <script>
    document.querySelectorAll('.nav-pill a').forEach(link => {
      link.addEventListener('click', e => {
        const href = link.getAttribute('href');
        if (href === "#") { e.preventDefault(); }
        document.querySelectorAll('.nav-pill a').forEach(a => a.classList.remove('active'));
        link.classList.add('active');
      });
    });
  </script>
</body>
</html>
