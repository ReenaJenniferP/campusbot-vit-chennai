<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusBot</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="grid"></div>

  <div id="siteHeader"></div>

  <div class="page page-landing">
    <div class="container">
      <section class="hero">
        <h1>Faster Answers. Smarter <span>Experience.</span></h1>
        <p>
          CampusBot helps students quickly explore campus information, academic details,
          announcements, departments, contacts, and updates through a clean chatbot experience.
        </p>

        <div class="cta-row">
          <a class="btn secondary" href="login.html">Log in</a>
          <a class="btn primary" href="signup.html">Sign Up</a>
        </div>
        <div class="campus-map panel">
          <img src="images/vit-campus.jpg" alt="Aerial view of VIT campus" class="campus-map-image" />

          <button class="campus-spot library-spot" type="button">
            <span class="spot-dot"></span>
            <span class="spot-tip">Library</span>
          </button>

          <button class="campus-spot auditorium-spot" type="button">
            <span class="spot-dot"></span>
            <span class="spot-tip">Auditorium</span>
          </button>

          <button class="campus-spot academic-spot" type="button">
            <span class="spot-dot"></span>
            <span class="spot-tip">Academic Blocks</span>
          </button>
        </div>
      </section>
    </div>
  </div>

  <footer class="site-footer">
    <p>Reena Jennifer P • 24BCE1041 • CampusBot</p>
  </footer>

  <script src="js/site-header.js"></script>
  <script> renderSiteHeader("home"); </script>
  <script src="js/bg-canvas.js"></script>
</body>
</html>
