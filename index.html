<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>CampusBot - A chatbot for chennai.vit.ac.in</title>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h1 { margin: 0 0 6px 0; }
    .meta { font-size: 12px; color: #555; margin-bottom: 16px; }

    input { width: 100%; padding: 10px; font-size: 14px; }
    button { padding: 10px 12px; margin-top: 10px; font-size: 14px; cursor: pointer; }
    #answer { margin-top: 14px; padding: 12px; border: 1px solid #ccc; min-height: 80px; white-space: pre-wrap; }
    .row { display: flex; gap: 10px; }
    .row button { flex: 1; }
  </style>
</head>

<body>
  <h1>CampusBot</h1>
  <div class="meta">
    Reg No: <span>24BCE1041</span> | Name: <span>Reena Jennifer P</span> | Date: <span>18-12-2025</span>
  </div>

  <input id="q" type="text" placeholder="Type your question..." />

  <div class="row">
    <button id="askBtn">Ask</button>
    <button id="clearBtn">Clear</button>
  </div>

  <div id="answer">Answer will show here.</div>

  <script>
    const input = document.getElementById("q");
    const answerBox = document.getElementById("answer");
    const askBtn = document.getElementById("askBtn");
    const clearBtn = document.getElementById("clearBtn");

    // Change this later if your backend runs on a different port/path
    const API_URL = "http://localhost:8000/chat";

    async function ask() {
      const question = input.value.trim();
      if (!question) return;

      answerBox.textContent = "Thinking...";
      askBtn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        if (!res.ok) {
          answerBox.textContent = "Server error: " + res.status;
          askBtn.disabled = false;
          return;
        }

        const data = await res.json();
        answerBox.textContent = data.answer ?? "(No answer returned)";
      } catch (e) {
        answerBox.textContent =
          "Backend not running yet.\n" +
          "Later we will create a Python server at: " + API_URL + "\n\n" +
          "Error: " + e;
      }

      askBtn.disabled = false;
    }

    function clearSlate() {
      input.value = "";
      answerBox.textContent = "Answer will show here.";
      input.focus();
    }

    askBtn.addEventListener("click", ask);
    clearBtn.addEventListener("click", clearSlate);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") ask();
    });
  </script>
</body>
</html>
