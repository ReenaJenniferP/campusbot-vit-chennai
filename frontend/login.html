<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusBot Sign In</title>
  <style>
    :root {
      --bg: #000000;
      --card: rgba(18, 20, 32, 0.92);
      --card-border: rgba(167, 139, 250, 0.16);
      --text: #f6f7ff;
      --muted: #9ca3b7;
      --input-bg: rgba(255, 255, 255, 0.06);
      --input-text: #c4c9d6;
      --button-top: #b9a8ff;
      --button-bottom: #4d8dff;
      --button-border: rgba(255,255,255,0.08);
      --shadow: 0 24px 60px rgba(0,0,0,0.55);
      --radius-card: 28px;
      --radius-input: 14px;
      --radius-button: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body { overflow: hidden; }

    .page {
      min-height: 100vh;
      position: relative;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 18%, rgba(77,141,255,0.20), transparent 20%),
        radial-gradient(circle at 80% 20%, rgba(143,107,255,0.18), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(122,166,255,0.12), transparent 28%),
        #000;
      padding: 24px;
    }

    .header {
      position: absolute;
      top: 26px;
      left: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .logo-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #b9a8ff 0%, #4d8dff 100%);
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
      display: grid;
      place-items: center;
      color: #0b0d14;
      font-size: 15px;
      flex: 0 0 36px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 34px 30px 28px;
      backdrop-filter: blur(14px);
    }

    h1 {
      text-align: center;
      font-size: 27px;
      line-height: 1.1;
      letter-spacing: -0.04em;
      font-weight: 700;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
      max-width: 310px;
      margin: 0 auto 28px;
    }

    .field {
      height: 46px;
      border-radius: var(--radius-input);
      background: var(--input-bg);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 15px;
      color: var(--input-text);
      margin-bottom: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .field svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex: 0 0 18px;
    }

    .field input {
      border: 0;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 14px;
      color: #eef1ff;
      font-family: inherit;
    }

    .field input::placeholder { color: var(--input-text); }

    .forgot {
      display: block;
      text-align: right;
      margin: 2px 2px 18px;
      color: #b9a8ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }

    .submit {
      width: 100%;
      height: 50px;
      border: 1px solid var(--button-border);
      border-radius: var(--radius-button);
      background: linear-gradient(135deg, var(--button-top) 0%, var(--button-bottom) 100%);
      color: #07080d;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(77,141,255,0.20);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0 16px;
      color: #8e95a9;
      font-size: 13px;
      justify-content: center;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background-image: linear-gradient(to right, rgba(255,255,255,0.10) 50%, rgba(255,255,255,0) 0%);
      background-size: 8px 1px;
      background-repeat: repeat-x;
    }

    .socials {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .social {
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: #f6f7ff;
      display: grid;
      place-items: center;
      font-size: 18px;
      cursor: pointer;
    }

    .social.google { color: #7aa6ff; }
    .social.facebook { color: #b9a8ff; }
    .social.apple { color: #ffffff; }

    .bottom-text {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
    }

    .signup-link {
      color: #b9a8ff;
      text-decoration: none;
      font-weight: 500;
    }

    .signup-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 560px) {
      .header {
        top: 18px;
        left: 18px;
        font-size: 20px;
      }

      .card {
        max-width: 380px;
        padding: 28px 22px 22px;
      }

      h1 { font-size: 24px; }
      .subtitle { font-size: 15px; }
    }
    .brand-text{
      color: #ffffff;
    }

    .brand-text span{
      color: #b9a8ff;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="logo-box">
        <i class="fa-solid fa-building-columns"></i>
      </div>
      <div class="brand-text">Campus<span>Bot</span></div>
    </div>

    <div class="card">
      <h1>Sign in with email</h1>
      <p class="subtitle"> Sign into CampusBot to access resources. </p>

      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm-.4 4.25-6.54 4.9a1.8 1.8 0 0 1-2.12 0L4.4 8.25V6.8l7.14 5.35a.75.75 0 0 0 .9 0L19.6 6.8Z"/></svg>
        <input type="email" placeholder="Email" />
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 8h-1V6a4 4 0 1 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-6 8.73V17a1 1 0 1 0 2 0v-.27a2 2 0 1 0-2 0ZM10 8V6a2 2 0 1 1 4 0v2Z"/></svg>
        <input type="password" placeholder="Password" />
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.1 3.51 3.5 2.1l18.4 18.4-1.41 1.4-3.05-3.04A13.6 13.6 0 0 1 12 20C6.5 20 2.1 15.97.5 12c.84-2.08 2.31-3.99 4.24-5.53Zm7.25 7.26 3.88 3.88A2.98 2.98 0 0 1 9.35 10.77ZM12 6c5.5 0 9.9 4.03 11.5 8-.67 1.66-1.75 3.22-3.16 4.53l-2.9-2.89c.35-.5.56-1.12.56-1.8a3.99 3.99 0 0 0-5.37-3.74L9.9 7.38A10.3 10.3 0 0 1 12 6Z"/></svg>
      </div>

      <a href="#" class="forgot">Forgot password?</a>

      <button class="submit">Get Started</button>

      <div class="divider">Or sign in with</div>

      <div class="socials">
        <button class="social google" aria-label="Sign in with Google">G</button>
        <button class="social facebook" aria-label="Sign in with Facebook">f</button>
        <button class="social apple" aria-label="Sign in with Apple"></button>
      </div>
      <div class="bottom-text">
          Don't have an account? <a class="signup-link" href="signup.html">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    document.querySelector('.submit').addEventListener('click', function (e) {
      e.preventDefault();
    });

    document.querySelectorAll('a[href="#"], .social').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.preventDefault();
      });
    });
  </script>
</body>
</html>
