<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CampusBot • Ask</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .ask-wrap{
      width:min(980px, 92vw);
      margin:0 auto;
      padding:88px 0 50px;
    }
    .ask-title{
      font-size:28px;
    }
    .ask-panel{
      padding:16px;
    }
    .ask-input{
      flex:1;
      min-width:260px;
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <div class="top">
    <div class="id"><b>Reena Jennifer P</b> • Reg No: <b>24BCE1041</b></div>
    <div class="id">
      <a href="home.html">Home</a> • <a href="login.html">Logout</a>
    </div>
  </div>

  <div class="ask-wrap">
    <h1 class="ask-title"><span>Ask</span> CampusBot</h1>

    <div class="panel ask-panel">
      <div class="row">
        <input id="q" class="ask-input" type="text" placeholder="Type your question..." />
        <button class="primary" id="askBtn">Ask</button>
        <button id="clearBtn">Clear</button>
      </div>

      <div class="answer" id="answer">Ask a question to see the answer here.</div>

      <div class="sourcesTitle" id="sourcesTitle">Sources</div>
      <div class="sources" id="sources"></div>
    </div>
  </div>

  <script src="js/bg-canvas.js"></script>
  <script src="js/ask.js"></script>

</html>
