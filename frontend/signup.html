<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusBot • Sign Up</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="grid"></div>

  <div class="auth-page">
    <div class="auth-header">
      <div class="logo-box"><i class="fa-solid fa-building-columns"></i></div>
      <div class="brand-text">Campus<span>Bot</span></div>
    </div>

    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="subtitle">Join CampusBot to access academic support, campus resources, and personalized student assistance.</p>

      <div class="form-grid">
        <div class="field">
          <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg>
          <input id="firstName" type="text" placeholder="First name" />
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg>
          <input id="lastName" type="text" placeholder="Last name" />
        </div>
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm-.4 4.25-6.54 4.9a1.8 1.8 0 0 1-2.12 0L4.4 8.25V6.8l7.14 5.35a.75.75 0 0 0 .9 0L19.6 6.8Z"/></svg>
        <input type="email" placeholder="College email address" />
      </div>

      <div class="form-grid">
        <div class="field">
          <svg viewBox="0 0 24 24"><path d="M7 2h10v2h3a1 1 0 0 1 1 1v15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1h3Zm10 4H7v2h10Zm0 5H7v2h10Zm-4 5H7v2h6Z"/></svg>
          <input type="text" placeholder="Registration number" />
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24"><path d="M12 2 1 7l11 5 9-4.09V17h2V7Zm-7 9.18V16l7 4 7-4v-4.82l-7 3.18Z"/></svg>
          <select>
            <option value="" selected disabled>Year of study</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
            <option>Postgraduate</option>
          </select>
        </div>
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v4H4Zm0 6h16v10H4Zm3 2v2h4v-2Zm0 4v2h7v-2Z"/></svg>
        <input type="text" placeholder="Department / Program" />
      </div>

      <div class="form-grid">
        <div class="field">
          <svg viewBox="0 0 24 24"><path d="M17 8h-1V6a4 4 0 1 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-6 8.73V17a1 1 0 1 0 2 0v-.27a2 2 0 1 0-2 0ZM10 8V6a2 2 0 1 1 4 0v2Z"/></svg>
          <input id="newPassword" type="password" placeholder="Create password" />
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24"><path d="M17 8h-1V6a4 4 0 1 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-6 8.73V17a1 1 0 1 0 2 0v-.27a2 2 0 1 0-2 0ZM10 8V6a2 2 0 1 1 4 0v2Z"/></svg>
          <input id="confirmPassword" type="password" placeholder="Confirm password" />
        </div>
      </div>

      <div class="help-row">
        <label class="checkbox-wrap">
          <input type="checkbox" />
          <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
        </label>
      </div>

      <button class="submit" id="signupBtn">Create Account</button>

      <div class="divider">Or sign up with</div>

      <div class="socials">
        <button class="social google" type="button">G</button>
        <button class="social facebook" type="button">f</button>
        <button class="social apple" type="button"></button>
      </div>

      <div class="bottom-text">
        Already have an account? <a class="signin-link" href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Reena Jennifer P • 24BCE1041 • CampusBot</p>
  </footer>

  <script src="js/bg-canvas.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
